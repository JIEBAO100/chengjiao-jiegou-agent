# Netlify 部署配置
# ------------------------------------------------------------------
# 本项目采用「扁平结构」：网页文件（index.html、styles.css、各个 .js）
# 全部直接放在仓库根目录，只有一个 functions/ 文件夹用来放云端接口。
#
# 这样做的好处：静态托管时不会出现文件夹嵌套问题；
# 逐笔成交等高频数据默认由浏览器直连交易所获取，云端函数只做兜底，
# 免费额度不会被轮询流量耗尽。
# ------------------------------------------------------------------

[build]
  # 发布目录：整个仓库根目录就是网站根目录
  publish = "."
  # 云端接口目录：functions/
  functions = "functions"

[build.environment]
  NODE_VERSION = "20"

# 前端统一调用 /api/xxx，由 Netlify Functions 转发处理
[[redirects]]
  from = "/api/market"
  to = "/.netlify/functions/market"
  status = 200

[[redirects]]
  from = "/api/symbols"
  to = "/.netlify/functions/symbols"
  status = 200

# 逐笔成交代理：浏览器直连失败时的兜底通道（正常流量不走这里）
[[redirects]]
  from = "/api/trades"
  to = "/.netlify/functions/trades"
  status = 200

# 单页兜底：其余路径都回到 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
